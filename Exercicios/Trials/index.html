<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Hover com Iframe</title>
  <style>
    .quadrado {
      width: 150px;
      height: 150px;
      background-color: #3498db;
      margin: 50px auto;
      cursor: pointer;
    }

    .iframe-container {
      width: 80%;
      margin: 20px auto;
      display: none; /* começa escondido */
    }

    /* quando o mouse passa no quadrado, mostra o iframe */
    .quadrado:hover + .iframe-container {
      display: block;
    }

    iframe {
      width: 100%;
      height: 400px;
      border: none;
    }
  </style>
</head>
<body>
  <div class="quadrado"></div>
  <div class="iframe-container">
    <iframe src="https://www.exemplo.com" class="meuIframe"></iframe>
  </div>
</body>
</html>
