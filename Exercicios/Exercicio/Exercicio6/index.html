<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguinte. Passe o mouse sobre os termos para descobrir qual tag deverá utilizar me cada caso.</p>

    <ul Style="list-style-type: square;">
        <li>
            <strong>
                <abbr title="User a tag&lt;p&gt;">Parágrafo</abbr>
            </strong>
        </li>
        <li>
            <strong>
                <abbr title="Use a tag&lt;h1&gt;">Títulos</abbr>
            </strong>
        </li>
        <li>
            <strong>
                <abbr title="Use a tag&lt;img&gt;">Imagens</abbr>
            </strong>
        </li>
        <li>
            <strong>
                <abbr title="Use a tag&lt;abbr&gt;">Abrevições</abbr>
            </strong>
        </li>
        <li>
            <strong>
                <abbr title="Use a tag&lt;code&gt;">Códigos-fonte</abbr>
            </strong>
        </li>
        <li>
            <strong>
                <abbr title="Use a tag&lt;ol&gt;">Listas numeradas</abbr>
            </strong>
        </li>
        <li>
            <strong>
                <abbr title="Use a tag&lt;li&gt;">Lista com demarcadores</abbr>
            </strong>
        </li>
    </ul>
</body>
</html>
