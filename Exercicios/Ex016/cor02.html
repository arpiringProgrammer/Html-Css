<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        /* Configurações globais do CSS */
        html, body { 
            height: 100%;
            margin: 0;
        }
        body {
            background-image: linear-gradient(45deg, #5659CC,#9139AF,#BE338D,#E13865,#FED373);
        }
    </style>
</head>
<body>
    <h1>Testando gradiente</h1>
</body>
</html>
