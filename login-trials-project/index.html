<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/grande.css">
    <link rel="stylesheet" href="estilos/media.css">
    <link rel="stylesheet" href="estilos/pequena.css">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <title>Document</title>
</head>
<body>
    <section class="login">
        <div class="info">
            <h1>Login</h1>
            <p class="firstMessage">Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
            <div class="infoEmail">
                <span class="material-symbols-outlined">account_circle</span>
                <input type="email" name="email" id="iemail" autocomplete="email" required size="16">
            </div>
            
            <div class="infoSenha">
                <span class="material-symbols-outlined">Key</span>
                <input type="password" name="sen" id="isen" required minlength="8" maxlength="20" placeholder="sua senha" autocomplete="new-password" size="16">
            </div>
            
            <p class="entrar">Entrar</p>
            <p class="esqueci">Esqueci a senha <span class="material-symbols-outlined">Mail</span></p>
        </div>
        <div class="foto">
           <img src="imagens/Copilot_20260602_132623.webp" alt="colorful">
           <img src="imagens/fotoGrande.webp" alt="grandeFoto">
           <img src="imagens/estatuas.jpg" alt="pantano">
        </div>
    </section>
</body>
</html>
